remaining:
- id: SXHKD-011
  status: pending
  priority: P1
  gap: sxhkd line continuations, chord chains/modes, replay, and synchronous execution are not equivalent to the current action
    model.
  task: Extend migration only where semantics can be represented exactly; retain explicit approximate/unsupported classifications
    otherwise.
  acceptance_criteria:
  - No unsupported construct becomes an active literal chord.
  - Multi-line syntax is either imported exactly or rejected with source-located diagnostics.
  - Replay and synchronous execution are never claimed as exact.
  suggested_files:
  - unilii/core/src/key_import_sxhkd.rs
  - unilii/core/tests/fixtures/sxhkd
- id: HK-KEYS-011
  status: pending
  priority: P1
  gap: Current evdev physical-key naming and i3/X11 logical keysyms are not a single explicit model.
  task: Define backend-neutral physical versus logical key semantics.
  acceptance_criteria:
  - Configuration chooses physical or logical interpretation explicitly.
  - Import/export reports semantic changes caused by keyboard layout.
  - Tests cover at least US and German layout-sensitive shortcuts.
  suggested_files:
  - unilii/core/src/key_spec.rs
  - KEYBINDINGS.md
- id: HK-SOAK-020
  status: pending
  priority: P2
  gap: Long-running reload, device, and action performance budgets are not recorded.
  task: Add soak tests and bounded runtime metrics.
  acceptance_criteria:
  - Repeated reloads retain the last-known-good generation.
  - Idle CPU and memory budgets are measured.
  - Action failure volume cannot create unbounded logs or child processes.
- id: STABLE-100
  status: pending
  target_release: 1.0.0
  priority: P1
  gap: The workspace has not selected and classified the exact stable CLI, configuration, IPC, service, package, state, Rust,
    and plugin-facing surfaces.
  task: Define the stable compatibility inventory, thin the binary composition root, remove transitional production allowances,
    and prove package-quality installation, migration, upgrade, rollback, and removal.
  acceptance_criteria:
  - Every inventoried surface is stable, deprecated with a horizon, experimental, or internal.
  - Selected stable surfaces have compatibility tests and migration documentation.
  - The unilii compatibility layer has an explicit retain, deprecate, or future-major removal policy.
  - No broad production dead-code allowance or tracked archival source remains.
  - A 1.0 release candidate soak period has no unresolved P0 or P1 correctness, security, data-loss, or compatibility defect.
release_gate:
  required_commands:
  - python3 scripts/check_build_space.py
  - cargo fmt --all -- --check
  - python3 scripts/check_release_metadata.py --candidate
  - scripts/test_safe.sh
  - scripts/test_i3_hotkeys.sh
  - CARGO_INCREMENTAL=0 cargo clippy --workspace --all-targets -- -D warnings
  manual_checks:
  - Review CHANGELOG.md migration notes.
  - Confirm generated i3 include in an isolated or intentionally selected session.
  - Confirm no sxhkd and i3 duplicate ownership remains at cutover.
