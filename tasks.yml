- id: PROVIDER-040
  target: 0.4.0
  title: Provider lifecycle completion
  status: planned
  depends_on:
  - PATCH-033
  work:
  - Replace provider test-backend labels with executable injected backends.
  - Apply startup, loading, fresh, stale, error, disabled, shutting-down, stopped, timeout, refresh-generation, and instance-generation behavior consistently.
  - Extract provider lifecycle ownership from the main Iced composition root.
  - Publish bounded live provider diagnostics over the action bus and in the panel.
  - Add provider replacement and refresh-churn soak tests.
  - Add a native Linux AArch64 release lane whose publication is conditional on native artifact tests.
