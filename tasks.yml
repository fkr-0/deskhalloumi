principles:
- Preserve every released CLI, configuration, IPC, path, application-ID, service, and compatibility contract unless a future release documents a migration.
- Add behavior through the existing runtime, provider, menu, action, and hotkey contracts rather than parallel stacks.
- Require focused regression evidence before implementation and full release gates before tagging.
